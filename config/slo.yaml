service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: Dựa trên baseline hệ thống có latency trung bình 400-600ms (P95 < 1000ms), SLO đặt ra là 99.5% request hoàn thành thành công và có latency_ms <= 3000ms trong cửa sổ 28 ngày. Error budget tương ứng là 0.5%. Với quy mô giả định 10,000 request/tháng (28 ngày), hệ thống cho phép tối đa 50 request bị lỗi hoặc vượt quá 3000ms trước khi kích hoạt quy trình đóng băng release và tập trung sửa lỗi.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90

