alerts:
  - name: HighLatencyP95
    severity: warning
    condition: p95(latency_ms) > 3000ms
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602607
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: error_rate_pct > 2% or retrieval_success_rate_pct < 90%
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602607
    runbook: docs/alerts.md#alert-2
  - name: CostBudgetSpike
    severity: warning
    condition: total_cost_usd > 2.5 or cost_usd_per_minute > 0.05
    duration: 5m
    type: symptom-based
    channel: slack
    owner: student-2A202602607
    runbook: docs/alerts.md#alert-3
